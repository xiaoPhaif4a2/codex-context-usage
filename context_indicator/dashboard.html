<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex 上下文</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,"Microsoft YaHei",sans-serif}body{max-width:660px;margin:32px auto;padding:0 24px}h1{font-size:24px}p{line-height:1.65}.muted{color:#818a95;font-size:13px}select,button,input{font:inherit;padding:9px;border:1px solid #b6bec8;border-radius:8px;background:transparent;color:inherit}select{width:100%}.meter{display:flex;align-items:center;gap:14px;margin:24px 0;flex-wrap:wrap}.ring{width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--color,#687480) var(--used,0%),#ddd 0);display:grid;place-items:center}.ring:after{content:"";width:44px;height:44px;background:Canvas;border-radius:50%}#percent{font-size:34px}#advice{padding:16px;border:1px solid #b6bec8;border-radius:10px}#advice[data-rank="2"],#advice[data-rank="3"]{background:#fff2d3;color:#785211}button{cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;font:13px/1.7 system-ui}input{width:55px}.limits,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#message{color:#ba790b}textarea{width:100%;box-sizing:border-box;height:160px;font:13px/1.6 system-ui}
</style>
<h1>Codex 上下文</h1><p class="muted">自动跟随当前对话 · 本地日志读数 · 每 2 秒刷新</p>
<select id="sessions" aria-label="切换对话"><option value="">自动跟随当前对话</option></select>
<div class="meter"><span class="ring"></span><strong id="percent">—%</strong><span id="tokens" class="muted">等待读数</span></div>
<pre id="details"></pre>
<section id="advice" aria-live="polite"><strong id="advice-title">等待读数</strong><p id="reason"></p><p id="next"></p></section>
<p class="muted">经验建议，不代表已检测到记忆丢失。单次高占用或一次压缩不要求换对话。</p>
<div class="limits"><label>关注容量 <input id="warning" type="number" min="1" max="99" value="70"> %</label><label>高占用 <input id="critical" type="number" min="2" max="100" value="85"> %</label><button id="save">保存阈值</button></div>
<p class="actions"><button id="checkpoint">留存进度（当前对话继续）</button><button id="handoff">准备交接（新对话继续）</button></p>
<p class="actions"><button id="confirmed">我已确认文档保存完成</button><button id="issue">标记遗漏 / 混淆</button></p>
<textarea id="prompt" aria-label="生成文档的提示词" readonly hidden></textarea><p id="message" role="status"></p>
<p class="muted">点击按钮只复制提示词，需粘贴到当前对话发送。先检查 HANDOFF.md，再决定是否切换。交接时新建对话并输入“请读取 HANDOFF.md 继续工作”。</p>
<script>
const $=id=>document.getElementById(id);let data=null,current=null,initialized=false;
function render(){
 current=data.navigation_known?data.sessions.find(s=>s.id===data.active_thread_id):null;
 const p=current?.percent??null,level=current?.level??'unknown',a=current?.advice;
 $('percent').textContent=p===null?'—%':p.toFixed(1)+'%';
 $('tokens').textContent=p===null?'等待有效读数':`${current.used_tokens.toLocaleString()} / ${current.context_window.toLocaleString()} tokens`;
 document.documentElement.style.setProperty('--used',Math.min(p??0,100)+'%');
 document.documentElement.style.setProperty('--color',{normal:'#687480',warning:'#ba790b',critical:'#d14b44',unknown:'#9199a2'}[level]);
 let details=current?`当前对话：${current.title??'未命名对话'}\n模型：${current.model??'未知'}\n读数时间：${current.updated_at?new Date(current.updated_at).toLocaleString():'暂无'}\n上下文压缩：${current.compactions??0} 次`:'尚未获得当前对话的有效读数。';
 const compact=current?.last_compaction;if(compact){const pct=x=>x===null?'等待新读数':x.toFixed(1)+'%';details+=`\n最近压缩：${compact.at?new Date(compact.at).toLocaleString():'时间未知'}\n压缩前 → 压缩后首个读数：${pct(compact.before_percent)} → ${pct(compact.after_percent)}；历史对话仍可见。`}
 $('details').textContent=details;$('advice-title').textContent=a?.label??'等待读数';$('reason').textContent=a?.reasons.join('；')??'未识别当前对话时不提供交接建议。';$('next').textContent=a?.action??'';$('advice').dataset.rank=a?.rank??0;
 if(a?.checkpoint_at)$('next').textContent+='\n你最近确认留存进度：'+new Date(a.checkpoint_at).toLocaleString();
 $('issue').textContent=a?.quality_issue?'撤销遗漏 / 混淆标记':'标记遗漏 / 混淆';
 for(const id of ['checkpoint','handoff','confirmed','issue'])$(id).disabled=!current;
 document.title=(p===null?'—':p.toFixed(0)+'%')+' · '+(current?.title??'Codex 上下文');
}
async function action(payload){const response=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok)throw Error('操作失败，请确认当前对话已识别，且本地目录可写。');data=await response.json();render()}
async function poll(){try{
 const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw Error();data=await response.json();
 if(!initialized){initialized=true;try{const saved=JSON.parse(localStorage.getItem('thresholds:'+data.project));if(saved&&0<saved.warning&&saved.warning<saved.critical&&saved.critical<=100)await action({action:'thresholds',...saved})}catch{}$('warning').value=data.thresholds.warning;$('critical').value=data.thresholds.critical}
 // A focused picker keeps its names and values stable until the user finishes.
 if(document.activeElement!==$('sessions')){const selected=data.navigation_known?data.active_thread_id??'':'';$('sessions').replaceChildren(new Option('自动跟随当前对话',''),...data.sessions.map((s,i)=>new Option((s.title??'未命名对话')+' · '+(s.percent===null?'等待读数':s.percent.toFixed(1)+'%')+(data.sessions.filter(c=>c.title===s.title).length>1?' · '+(i+1):''),s.id)));if(selected&&!data.sessions.some(s=>s.id===selected))$('sessions').add(new Option(data.active_title??'当前对话 · 等待读数',selected));$('sessions').value=selected}
 render();if(data.errors.length)$('message').textContent=data.errors.join('；');
}catch{$('percent').textContent='—%';$('tokens').textContent='服务连接中断';$('message').textContent='请确认本地服务仍在运行。';current=null;$('advice-title').textContent='等待读数';$('reason').textContent='连接中断时不沿用旧的交接建议。';$('next').textContent='';$('advice').dataset.rank=0;for(const id of ['checkpoint','handoff','confirmed','issue'])$(id).disabled=true;document.documentElement.style.setProperty('--used','0%')}finally{setTimeout(poll,2000)}}
$('sessions').onchange=()=>{const id=$('sessions').value;if(!id){render();return}if(id!==data.active_thread_id){const link=document.createElement('a');link.href='codex://threads/'+encodeURIComponent(id);link.click();$('message').textContent='正在打开对应的 Codex 对话，等待导航更新。'}};
$('save').onclick=async()=>{const warning=Number($('warning').value),critical=Number($('critical').value);if(!(0<warning&&warning<critical&&critical<=100)){$('message').textContent='请输入 0 < 关注容量 < 高占用 ≤ 100。';return}try{await action({action:'thresholds',warning,critical});localStorage.setItem('thresholds:'+data.project,JSON.stringify({warning,critical}));$('message').textContent='阈值已保存到此浏览器。'}catch(e){$('message').textContent=e.message}};
async function copy(mode){if(!current||!data.prompts[mode])return;const title=current.title,prompt=data.prompts[mode];$('prompt').value=prompt;$('prompt').hidden=false;try{await navigator.clipboard.writeText(prompt);$('message').textContent='已复制，请粘贴到“'+title+'”并发送；复制不代表文档已保存。'}catch{$('prompt').select();$('message').textContent='请复制下方提示词。'}}
$('checkpoint').onclick=()=>copy('checkpoint');$('handoff').onclick=()=>copy('handoff');
async function mark(name){if(!current)return;try{await action({action:name,thread_id:current.id});$('message').textContent=name==='checkpoint_saved'?'已记录你确认的保存状态。':'已更新当前对话的反馈标记。'}catch(e){$('message').textContent=e.message}}
$('confirmed').onclick=()=>mark('checkpoint_saved');$('issue').onclick=()=>mark(current?.advice.quality_issue?'clear_issue':'quality_issue');
poll();
</script>
</html>
